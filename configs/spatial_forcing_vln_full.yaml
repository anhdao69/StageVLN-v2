model:
  student_model: Qwen/Qwen3.5-4B
  teacher_model: facebook/VGGT-1B
  use_geometry_encoder: false
  use_geometry_fusion: false

dataset:
  dataset_config: configs/datasets/janusvln_r2r_rxr.json
  annotation_path: /mnt/data/vmo-ai-task/anhdh35/JanusVLN/train_r2r_rxr.json
  data_path: /mnt/data/vmo-ai-task/anhdh35/JanusVLN
  max_samples: -1
  max_history_frames: 8
  current_frame_last: true

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 1.0e-6
  warmup_ratio: 0.03
  precision: bf16
  gradient_checkpointing: true
  deepspeed_stage: 2
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 10

student:
  tune_mm_llm: true
  tune_mm_mlp: true
  tune_mm_vision: false
  spatial_forcing_layer: 24

teacher:
  frozen: true
  input_frames: current_only
  teacher_layer: 23
  use_vggt_pe: true
  use_history_cache: false

spatial_forcing:
  enabled: true
  align_current_frame_only: true
  loss_type: cosine
  loss_weight: 0.3
  projector: layernorm-linear-gelu-linear
